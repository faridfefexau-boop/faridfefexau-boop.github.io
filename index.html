<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>Catatan Usaha</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#6d4fe8"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{--p:#6d4fe8;--bg:#f3f0ff;--c:#fff;--t:#1d1a3a;--m:#7b7894;--g:#16a34a;--r:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
input,select{font:inherit;width:100%;border:0;border-radius:14px;background:#fff;padding:0 14px;min-height:48px;color:var(--t)}
small{color:var(--m)}h1{font-size:26px;margin:18px 0 14px}h2{margin:0;font-size:20px}
[hidden]{display:none!important}
.pg{max-width:520px;margin:0 auto;padding:18px 16px 120px}
.hi{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.av{width:48px;height:48px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.hero{background:linear-gradient(135deg,#8b6cf0,#6244dc);color:#fff;border-radius:26px;padding:20px;margin-bottom:14px}
.hero small{color:#e3dcff}.top{display:flex;justify-content:space-between;align-items:center}
.big{font-size:32px;font-weight:800;margin:6px 0}.pill{display:inline-block;background:#ffffff30;border-radius:99px;padding:4px 12px;font-size:13px}
.two{display:flex;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid #ffffff40}.two>div{flex:1}.two b{display:block}
.btns{display:flex;gap:10px;margin-bottom:18px}.btn{flex:1;min-height:52px;border-radius:99px;background:var(--p);color:#fff;font-weight:700;padding:0 18px}
.btn.lt{background:#e6e0ff;color:var(--p)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 4px 10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tl{border-radius:20px;padding:14px;font-size:22px}.tl small{display:block;font-size:13px;margin-top:6px}.tl b{display:block;font-size:17px;margin-top:2px}
.a{background:#e8e4ff}.b{background:#fde4ea}.c{background:#ffeed6}.d{background:#dff5e6}
.card{background:var(--c);border-radius:20px;padding:14px;margin-bottom:12px;display:flex;gap:12px;align-items:center}
.it{display:flex;gap:10px;align-items:center;background:var(--c);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.ic{font-size:22px}.mm{flex:1;min-width:0}.mm b,.mm small{display:block;overflow-wrap:anywhere}
.am{font-weight:700;white-space:nowrap}.g{color:var(--g)}.r{color:var(--r)}
.sm{background:#f1eefc;border-radius:10px;padding:8px 10px;font-size:13px;min-height:40px}
.emp{text-align:center;color:var(--m);padding:30px 0}
.mn{display:flex;justify-content:space-between;align-items:center;background:var(--c);border-radius:99px;padding:6px;margin-bottom:14px}
.mn button{width:44px;height:44px;border-radius:50%;background:#ece8ff;font-size:18px}.mn b{font-size:16px}
.ch{display:flex;gap:8px;align-items:flex-end;height:150px;margin:12px 0}.cc{flex:1;text-align:center}
.bb{height:120px;display:flex;gap:3px;align-items:flex-end;justify-content:center}.bb i{width:40%;border-radius:4px 4px 0 0;min-height:2px}
.cur{color:var(--t);font-weight:700}.lg{display:flex;gap:14px;font-size:13px;color:var(--m)}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.lr{display:flex;justify-content:space-between;padding:9px 0}.lr.s{color:var(--m);padding-left:14px}.lr.t{font-weight:700;border-top:1px solid #eee}
.mi{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--c);border-radius:20px;padding:14px;margin-bottom:10px;font-size:24px}
.mi div{flex:1;font-size:15px}.mi b,.mi small{display:block}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(92%,480px);background:#fff;border-radius:99px;padding:8px;display:flex;justify-content:space-around;align-items:center;box-shadow:0 6px 24px #6d4fe833}
.nav button{height:46px;padding:0 14px;border-radius:99px;font-size:20px;color:var(--m)}
.nav button.on{background:var(--p);color:#fff;font-size:15px;font-weight:700}
.nav .pl{background:var(--p);color:#fff;width:54px;height:54px;border-radius:50%;font-size:28px;padding:0}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.x{width:44px;height:44px;border-radius:50%;background:#fff}
.seg{display:flex;background:#e9e4ff;border-radius:99px;padding:4px;margin-bottom:12px}
.seg button{flex:1;min-height:44px;border-radius:99px;font-weight:600;color:var(--m)}.seg .on{background:var(--p);color:#fff}
.amt{display:flex;align-items:center;gap:8px;background:#fff;border-radius:20px;padding:6px 12px;margin-bottom:12px;font-size:26px;font-weight:700;color:var(--m)}
.amt input{font-size:28px;font-weight:800;padding:0;background:none}.amt button{background:#ece8ff;color:var(--p);border-radius:12px;padding:8px 12px;font-size:15px;font-weight:700}
.lb{font-size:12px;font-weight:700;color:var(--m);margin:10px 0 6px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:#fff;border-radius:16px;padding:10px 4px;font-size:24px;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent}
.tile span{font-size:12px;text-align:center;font-weight:600}.tile.on,.chip.on{border-color:var(--p);background:#ece8ff}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#fff;border:2px solid transparent;border-radius:99px;padding:10px 14px;font-weight:600}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
.ct{text-align:center;padding:16px}.logo{width:84px;height:84px;border-radius:24px;background:linear-gradient(135deg,#ffd45c,#f5a30f);display:grid;place-items:center;font-size:44px;margin:30px auto 14px}
.dots{display:flex;gap:14px;justify-content:center;margin:20px 0}.dots i{width:16px;height:16px;border:2px solid var(--m);border-radius:50%}.dots i.f{background:var(--p);border-color:var(--p)}
.kp{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center;margin-top:24px}
.kp button{height:76px;border-radius:50%;background:#fff;font-size:26px;font-weight:700}
.err{color:var(--r);min-height:20px;font-size:14px;margin-top:8px}
form>*{margin-bottom:10px}
</style></head><body>
<div id="pin" class="ct" hidden></div>
<div id="app" hidden><div class="pg" id="main"></div>
<div class="nav" id="nav"></div></div>
<div class="ov" id="ov" hidden><div class="sh" id="sheet"></div></div>
<script src="config.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
var BLN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var B3=BLN.map(function(b){return b.slice(0,3)}),HR=["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
var KANAL=["Langsung","GoFood","GrabFood","ShopeeFood"];
var S={page:"home",hide:false,tx:[],kat:[],u:{},usaha:"",today:"",ym:""},F={},tok="",pn="";
try{tok=localStorage.getItem("tok")||""}catch(e){}
function setTok(t){tok=t;try{t?localStorage.setItem("tok",t):localStorage.removeItem("tok")}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function R(n){return (n<0?"-":"")+"Rp"+Math.abs(Math.round(n)).toLocaleString("id-ID")}
function V(n){return S.hide?"Rp ******":R(n)}
function fd(d){var x=new Date(d+"T00:00:00");return HR[x.getDay()]+", "+x.getDate()+" "+B3[x.getMonth()]+" "+x.getFullYear()}
function grup(k){var f=S.kat.filter(function(x){return x.nama==k})[0];return f?f.grup:"operasional"}
function emo(k){var f=S.kat.filter(function(x){return x.nama==k})[0];return f?f.emoji:"🧾"}
function own(){return S.u.peran=="pemilik"}
function agg(L){var g=0,pot=0,b=0,k=0,o=0,por=0;
  L.forEach(function(t){if(t.jenis=="jual"){g+=t.jumlah;pot+=t.potongan;por+=t.porsi}
    else{var q=grup(t.kategori);if(q=="bahan")b+=t.jumlah;else if(q=="kemasan")k+=t.jumlah;else o+=t.jumlah}});
  var rev=g-pot;return{g:g,pot:pot,rev:rev,b:b,k:k,o:o,cost:b+k+o,gross:rev-b-k,net:rev-b-k-o,por:por}}
function inM(m){return S.tx.filter(function(t){return t.tanggal.slice(0,7)==m})}

/* ---------- Masuk / PIN ---------- */
function showPin(msg){
  $("app").hidden=true;$("pin").hidden=false;
  var d="";for(var i=0;i<6;i++)d+="<i"+(i<pn.length?" class=f":"")+"></i>";
  var k="";[1,2,3,4,5,6,7,8,9].forEach(function(n){k+="<button data-a=key data-v="+n+">"+n+"</button>"});
  $("pin").innerHTML='<div class="logo">💰</div><h1 style="margin:0">'+esc(S.usaha||"Catatan Usaha")+'</h1><p><small>Masukkan PIN untuk masuk</small></p><div class="dots">'+d+'</div><div class="err">'+esc(msg||"")+'</div><div class="kp">'+k+'<span></span><button data-a=key data-v=0>0</button><button data-a=key data-v="x">⌫</button></div>';
}
function showSetup(msg){
  $("app").hidden=true;$("pin").hidden=false;
  $("pin").innerHTML='<div class="logo">💰</div><h1 style="margin:0">Siapkan aplikasi</h1><p><small>Pertama kali: buat akun pemilik</small></p><form onsubmit="return false" style="text-align:left;max-width:360px;margin:auto"><input id="su" placeholder="Nama usaha" maxlength="60"><input id="sn" placeholder="Nama Anda" maxlength="40"><input id="sp" type="password" inputmode="numeric" maxlength="6" placeholder="PIN 6 angka"><input id="sp2" type="password" inputmode="numeric" maxlength="6" placeholder="Ulangi PIN"><div class="err">'+esc(msg||"")+'</div><button class="btn" style="width:100%" data-a=setup>Mulai</button></form>';
}
async function enter(r){setTok(r.tok);pn="";await load()}
async function load(){
  var d=await call("data");S.u=d.u;S.usaha=d.usaha;S.tx=d.tx;S.kat=d.kat;S.today=d.today;
  if(!S.ym)S.ym=d.today.slice(0,7);
  $("pin").hidden=true;$("app").hidden=false;draw();
}
async function init(){
  try{var st=await call("status");S.usaha=st.usaha;if(st.setup)return showSetup()}catch(e){return showPin(String(e))}
  if(tok){try{return await load()}catch(e){setTok("")}}
  showPin();
}

/* ---------- Halaman ---------- */
function draw(){
  var pg=S.page,o=own();
  $("main").innerHTML=pg=="home"?home():pg=="list"?list():pg=="rep"&&o?rep():kel();
  var N=[["home","🏠","Beranda"],["list","☰","Transaksi"],["+"],["rep","📊","Laporan"],["kel","▦","Kelola"]];
  $("nav").innerHTML=N.filter(function(n){return o||n[0]!="rep"}).map(function(n){
    return n[0]=="+"?'<button class="pl" data-a=add data-v=jual>＋</button>':'<button data-a=pg data-v='+n[0]+(pg==n[0]?' class="on">'+n[1]+" "+n[2]:">"+n[1])+"</button>"}).join("");
}
function sapa(){var h=new Date().getHours();return h<11?"pagi":h<15?"siang":h<18?"sore":"malam"}
function home(){
  var m=agg(inM(S.today.slice(0,7))),d=agg(S.tx.filter(function(t){return t.tanggal==S.today})),o=own();
  return '<div class="hi"><div class="av">'+esc(S.u.nama[0])+'</div><div><small>Selamat '+sapa()+',</small><h2>'+esc(S.u.nama)+'</h2></div></div>'+
  (o?'<div class="hero"><div class="top"><small>Laba bersih '+BLN[+S.today.slice(5,7)-1]+'</small><button data-a=eye style="font-size:20px">'+(S.hide?"🙈":"👁️")+'</button></div><div class="big">'+V(m.net)+'</div><span class="pill">'+(m.rev?"Margin "+Math.round(m.net/m.rev*100)+"%":"Belum ada penjualan")+'</span><div class="two"><div><small>Pendapatan bersih</small><b>'+V(m.rev)+'</b></div><div><small>Total biaya</small><b>'+V(m.cost)+'</b></div></div></div>':"")+
  '<div class="btns"><button class="btn" data-a=add data-v=jual>＋ Penjualan</button><button class="btn lt" data-a=add data-v=belanja>🛒 Belanja</button></div>'+
  '<div class="sec"><b>Hari ini</b><small>'+fd(S.today)+'</small></div><div class="tiles">'+
  '<div class="tl a">💰<small>Penjualan bersih</small><b>'+V(d.rev)+'</b></div><div class="tl b">🛒<small>Belanja</small><b>'+V(d.cost)+'</b></div>'+
  (o?'<div class="tl c">📈<small>Laba hari ini</small><b>'+V(d.net)+'</b></div>':"")+'<div class="tl d">🍌<small>Porsi terjual</small><b>'+d.por+' porsi</b></div></div>';
}
function mnav(){return '<div class="mn"><button data-a=mon data-v=-1>‹</button><b>'+BLN[+S.ym.slice(5)-1]+" "+S.ym.slice(0,4)+'</b><button data-a=mon data-v=1>›</button></div>'}
function list(){
  var o=own(),L=S.tx.filter(function(t){return !o||t.tanggal.slice(0,7)==S.ym}).sort(function(a,b){return b.tanggal.localeCompare(a.tanggal)});
  return "<h1>Transaksi</h1>"+(o?mnav():"")+(L.length?L.map(function(t){var j=t.jenis=="jual";
    return '<div class="it"><div class="ic">'+(j?"💰":emo(t.kategori))+'</div><div class="mm"><b>'+esc(j?"Penjualan "+t.kanal+" · "+t.porsi+" porsi":t.kategori)+'</b><small>'+fd(t.tanggal)+(t.catatan?" · "+esc(t.catatan):"")+'</small></div><div class="am '+(j?"g":"r")+'">'+(j?"+":"−")+R(j?t.jumlah-t.potongan:t.jumlah)+'</div>'+(o?'<button class="sm" data-a=del data-v="'+esc(t.id)+'">Hapus</button>':"")+'</div>'}).join(""):'<p class="emp">Belum ada transaksi</p>');
}
function rep(){
  var a=agg(inM(S.ym)),ms=[];
  for(var i=5;i>=0;i--){var y=+S.ym.slice(0,4),m=+S.ym.slice(5)-i;while(m<1){m+=12;y--}ms.push(y+"-"+("0"+m).slice(-2))}
  var D=ms.map(function(k){var x=agg(inM(k));x.k=k;return x}),mx=Math.max.apply(null,[1].concat(D.map(function(x){return Math.max(x.rev,Math.abs(x.net))})));
  var L=function(l,v,c){return '<div class="lr '+(c||"")+'"><span>'+l+'</span><span>'+R(v)+'</span></div>'};
  return "<h1>Laporan</h1>"+mnav()+'<div class="card" style="display:block"><small>6 bulan terakhir</small><div class="ch">'+D.map(function(x){
    return '<div class="cc"><div class="bb"><i style="height:'+x.rev/mx*100+'%;background:var(--p)"></i><i style="height:'+Math.abs(x.net)/mx*100+'%;background:'+(x.net<0?"var(--r)":"var(--g)")+'"></i></div><small'+(x.k==S.ym?' class="cur"':"")+'>'+B3[+x.k.slice(5)-1]+'</small></div>'}).join("")+
    '</div><div class="lg"><span><i style="background:var(--p)"></i>Pendapatan bersih</span><span><i style="background:var(--g)"></i>Laba bersih</span></div></div>'+
    '<div class="sec"><b>Laba rugi</b></div><div class="card" style="display:block">'+L("Penjualan kotor",a.g)+L("– Potongan platform",a.pot,"s")+L("Pendapatan bersih",a.rev,"t")+L("– Bahan baku",a.b,"s")+L("– Kemasan &amp; perlengkapan",a.k,"s")+
    L("Laba kotor"+(a.rev?" ("+Math.round(a.gross/a.rev*100)+"%)":""),a.gross,"t")+L("– Operasional",a.o,"s")+L("Laba bersih",a.net,"t")+'</div>';
}
function kel(){
  var o=own();
  return "<h1>Kelola</h1>"+'<div class="card"><div class="av">'+esc(S.u.nama[0])+'</div><div><b>'+esc(S.u.nama)+'</b><br><small>'+(o?"Pemilik":"Kasir")+" · "+esc(S.usaha)+'</small></div></div>'+
  (o?'<button class="mi" data-a=kat>🗂️<div><b>Kategori</b><small>Jenis belanja &amp; grupnya</small></div>›</button><button class="mi" data-a=mem>🔑<div><b>Anggota &amp; PIN</b><small>Pemilik &amp; kasir</small></div>›</button>':"")+
  '<button class="mi" data-a=out>🚪<div><b>Keluar</b><small>Kunci aplikasi dengan PIN</small></div></button>';
}

/* ---------- Sheet catat transaksi ---------- */
function sheet(h){$("sheet").innerHTML=h;$("ov").hidden=false}
function close_(){$("ov").hidden=true}
function keep(){var g=function(i){return $(i)?$(i).value:undefined};
  if($("amt")){F.amt=g("amt");F.dt=g("dt");F.nt=g("nt");if($("por"))F.por=g("por");if($("pot"))F.pot=g("pot")}}
function addSheet(){
  var j=F.jenis=="jual",o=own();
  sheet('<div class="hd"><h2>Catat transaksi</h2><button class="x" data-a=close>✕</button></div>'+
  '<div class="seg"><button data-a=jenis data-v=jual'+(j?' class="on"':"")+'>Penjualan</button><button data-a=jenis data-v=belanja'+(j?"":' class="on"')+'>Belanja</button></div>'+
  '<div class="amt">Rp <input id="amt" inputmode="numeric" placeholder="0" value="'+esc(F.amt||"")+'" oninput="fmt(this)"><button data-a=k000>000</button></div>'+
  (j?'<div class="lb">Kanal</div><div class="chips">'+KANAL.map(function(k){return '<button class="chip'+(F.kanal==k?" on":"")+'" data-a=kanal data-v="'+k+'">'+k+'</button>'}).join("")+'</div>'+
    '<div class="row"><div><div class="lb">Porsi</div><input id="por" type="number" min="1" value="'+(F.por||1)+'"></div>'+(F.kanal!="Langsung"?'<div><div class="lb">Potongan (Rp)</div><input id="pot" inputmode="numeric" value="'+esc(F.pot||"")+'" oninput="fmt(this)"></div>':"")+'</div>'
   :'<div class="lb">Kategori</div><div class="grid">'+S.kat.map(function(k){return '<button class="tile'+(F.kat==k.nama?" on":"")+'" data-a=kat2 data-v="'+esc(k.nama)+'">'+esc(k.emoji)+'<span>'+esc(k.nama)+'</span></button>'}).join("")+'</div>')+
  '<div class="row"><div><div class="lb">Tanggal</div><input type="date" id="dt" value="'+(F.dt||S.today)+'"'+(o?"":" disabled")+'></div><div><div class="lb">Catatan</div><input id="nt" maxlength="100" placeholder="opsional" value="'+esc(F.nt||"")+'"></div></div>'+
  '<div class="err" id="ferr"></div><button class="btn" style="width:100%;margin-top:6px" data-a=save>Simpan</button>');
}
function fmt(e){var v=e.value.replace(/\D/g,"");e.value=v?Number(v).toLocaleString("id-ID"):""}
function num(v){return Number(String(v||"").replace(/\D/g,""))}

/* ---------- Panel kelola ---------- */
function katSheet(){
  sheet('<div class="hd"><h2>Kategori</h2><button class="x" data-a=close>✕</button></div>'+S.kat.map(function(k){
    return '<div class="it"><div class="ic">'+esc(k.emoji)+'</div><div class="mm"><b>'+esc(k.nama)+'</b><small>'+k.grup+'</small></div><button class="sm" data-a=katdel data-v="'+esc(k.nama)+'">Hapus</button></div>'}).join("")+
  '<div class="lb">Tambah kategori</div><div class="row"><input id="kn" placeholder="Nama" maxlength="40" style="flex:3"><input id="ke" placeholder="😀" maxlength="4" style="flex:1;text-align:center"></div>'+
  '<select id="kg" style="margin-top:8px"><option value="bahan">Bahan baku</option><option value="kemasan">Kemasan &amp; perlengkapan</option><option value="operasional">Operasional</option></select><div class="err" id="ferr"></div><button class="btn" style="width:100%;margin-top:8px" data-a=katadd>Tambah</button>');
}
async function memSheet(){
  var r=await call("mList");
  sheet('<div class="hd"><h2>Anggota &amp; PIN</h2><button class="x" data-a=close>✕</button></div>'+r.m.map(function(m){
    return '<div class="it"><div class="av" style="width:40px;height:40px;font-size:16px">'+esc(m.nama[0])+'</div><div class="mm"><b>'+esc(m.nama)+'</b><small>'+m.peran+'</small></div>'+(m.nama!=S.u.nama?'<button class="sm" data-a=memdel data-v="'+esc(m.nama)+'">Hapus</button>':"")+'</div>'}).join("")+

function pwNet(a,p,t){return Promise.resolve().then(function(){if(typeof API_URL=="undefined"||String(API_URL).indexOf("http")!=0)throw{srv:1,msg:"Alamat server belum diisi di config.js"};return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({a:a,p:p||{},t:t||""})})}).then(function(r){return r.json().catch(function(){throw{srv:1,msg:"Server tidak membalas dengan benar. Cek alamat di config.js dan akses deployment (Siapa saja)."}})}).then(function(r){if(r&&r.err)throw{srv:1,msg:String(r.err)};return r})}
function pwOpt(p){try{var k="c:data:{}",c=JSON.parse(pwLs(k)||"null");if(!c)return;var j=p.jenis=="jual";c.tx.push({id:"q"+p.cid,tanggal:p.tanggal||c.today,jenis:p.jenis,kategori:j?"Penjualan":p.kategori,jumlah:Number(p.jumlah)||0,porsi:j?(Number(p.porsi)||1):0,kanal:j?p.kanal:"",potongan:j?(Number(p.potongan)||0):0,catatan:p.catatan||"",oleh:c.u.nama});pwLs(k,JSON.stringify(c))}catch(e){}}
function pwEnq(a,p){var q=pwQget();q.push({a:a,p:p});pwQset(q);pwOpt(p);pwBar();if(a=="add"&&typeof toast=="function")toast("Offline: tersimpan di HP, dikirim otomatis saat online");return Promise.resolve({ok:1,queued:1,stok:[],lewat:[]})}
function call(a,p){p=p||{};var w=PW_WQ.indexOf(a)>=0;if(w&&!p.cid)p.cid="c"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);var k="c:"+a+":"+JSON.stringify(p);if(w&&typeof navigator!="undefined"&&navigator.onLine===false)return pwEnq(a,p);return pwNet(a,p,tok).then(function(r){if(PW_RD.indexOf(a)>=0)pwLs(k,JSON.stringify(r));if(PW_OFF)pwOff(false);return r},function(e){if(e&&e.srv)throw e.msg;pwOff(true);if(PW_RD.indexOf(a)>=0){var c=pwLs(k);if(c){var r=JSON.parse(c);if(a=="data")r.today=pwLt();return r}}if(w)return pwEnq(a,p);throw "Tidak ada koneksi internet"})}
async function pwFlush(){var n=0,bad=0;if(PW_FL||!tok)return{n:0,bad:0};var q=pwQget();if(!q.length)return{n:0,bad:0};PW_FL=true;try{while(q.length){try{await pwNet(q[0].a,q[0].p,tok)}catch(e){if(e&&e.srv){if(/Sesi habis/.test(e.msg))break;bad++}else{pwOff(true);break}}q.shift();n++;pwQset(q)}}finally{PW_FL=false}pwBar();return{n:n,bad:bad}}
var load9=load;load=async function(){await load9();if(!(typeof navigator!="undefined"&&navigator.onLine===false)&&pwQget().length){var r=await pwFlush();if(r.n||r.bad){await load9();if(typeof toast=="function")toast(r.n+" catatan offline terkirim"+(r.bad?", "+r.bad+" ditolak server":""))}}pwBar()};
var out9=act.out;act.out=async function(){await out9();try{Object.keys(localStorage).forEach(function(k){if(k.indexOf("c:")==0)localStorage.removeItem(k)})}catch(e){}pwBar()};
window.addEventListener("online",function(){if(tok&&S.u&&S.u.nama)load()});
window.addEventListener("offline",function(){pwOff(true)});
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
pwBar();
init();
</script></body></html>
